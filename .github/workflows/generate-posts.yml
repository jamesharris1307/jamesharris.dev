name: Update Post List
on:
  push:
    paths:
      - 'posts/**'
permissions:
  contents: write
jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Rebuild posts.json
        run: |
          # Create a temporary file
          echo "[" > temp.json
          
          # Find all .md files, sort them, and format as JSON
          # This handles the "trailing comma" issue much more cleanly
          first=true
          for file in posts/*.md; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              if [ "$first" = true ]; then
                echo "{\"filename\": \"$fname\"}" >> temp.json
                first=false
              else
                echo ",{\"filename\": \"$fname\"}" >> temp.json
              fi
            fi
          done
          
          echo "]" >> temp.json
          mv temp.json posts.json
          
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add posts.json
          git commit -m "Auto-update posts list" || exit 0
          git push